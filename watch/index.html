<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Watch — Reel Boost Media | Local Promotions for Local Businesses</title>
<meta name="description" content="See what Reel Boost Media can do for your business — AI-powered, human-directed promo videos matched to your sales cycle. Start with a one-time $149 Pilot.">

<meta property="og:type" content="website">

<style>
  :root{
    --bg:#04070a; --bg2:#060d08; --panel:#0a140d; --line:rgba(1,169,56,.28);
    --emerald:#01A938; --emerald-hi:#2fe673; --gold:#E4AB2C; --gold-hi:#ffd968; --ink:#f5f8f5;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:radial-gradient(1100px 600px at 50% -10%, #0a1f10 0%, var(--bg2) 55%, var(--bg) 100%);
       color:var(--ink); font-family:"Segoe UI", system-ui, -apple-system, Arial, sans-serif;
       min-height:100vh; display:flex; flex-direction:column; align-items:center; padding:28px 18px 40px}
  .brand{display:flex; align-items:center; gap:12px; text-decoration:none; color:var(--ink); margin-bottom:6px}
  .brand .mark{width:44px;height:44px;border-radius:50%;border:3px solid var(--emerald);position:relative;flex:none}
  .brand .mark::after{content:"";position:absolute;inset:6px;border-radius:50%;border:2px dashed rgba(1,169,56,.55)}
  .brand .mark b{position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
                 color:var(--gold); font-size:22px; line-height:1}
  .brand .name{font-weight:800; letter-spacing:.5px; font-size:20px}
  .brand .name span{color:var(--emerald-hi)}
  .brand .name small{display:block; font-weight:600; font-size:11px; letter-spacing:3px; color:var(--gold)}
  h1{font-size:clamp(26px,4.5vw,40px); text-align:center; margin:18px 0 8px; font-weight:800}
  h1 em{font-style:normal; color:var(--emerald-hi)}
  .sub{text-align:center; color:#cfe6d4; font-size:clamp(15px,2.4vw,18px); margin-bottom:22px}
  .player{width:min(920px,100%); background:var(--panel); border:1px solid var(--line);
          border-radius:16px; padding:10px; box-shadow:0 24px 60px rgba(0,0,0,.55)}
  video{width:100%; display:block; border-radius:10px; background:#000; aspect-ratio:3/2}
  .cta{display:flex; flex-wrap:wrap; gap:14px; justify-content:center; margin-top:26px}
  .btn{text-decoration:none; font-weight:700; padding:13px 26px; border-radius:999px; font-size:16px}
  .btn-gold{background:linear-gradient(180deg,var(--gold-hi),var(--gold)); color:#241a02}
  .btn-ghost{border:1px solid var(--emerald); color:var(--emerald-hi)}
  .tag{margin-top:26px; text-align:center; font-weight:800; letter-spacing:2px; font-size:14px; color:var(--gold)}
  footer{margin-top:14px; text-align:center; color:#9fb8a6; font-size:13.5px; line-height:1.7}
  footer a{color:var(--emerald-hi); text-decoration:none}
</style>
</head>
<body>
  <a class="brand" href="../">
    <span class="mark"><b>&#9654;</b></span>
    <span class="name">REEL <span>BOOST</span><small>MEDIA</small></span>
  </a>

  <h1>See what a <em>Reel Boost</em> promo looks like</h1>
  <p class="sub">Local Promotions for Local Businesses — press play. Sixty seconds.</p>

  <div class="player">
    <video controls playsinline preload="metadata" poster="poster.jpg">
      <source src="reel-boost-media-spot-60s.mp4" type="video/mp4">
      Your browser can't play this video — see us at reelboostmedia.github.io
    </video>
  </div>

  <div class="cta">
    <a class="btn btn-gold" href="mailto:getreelboostmedia@gmail.com?subject=My%20%24149%20Pilot%20video">Start with a $149 Pilot</a>
    <a class="btn btn-ghost" href="../">Back to the site</a>
  </div>

  <p class="tag">AI-POWERED. HUMAN-DIRECTED.</p>
  <footer>
    Reel Boost Media · Benton, Illinois area<br>
    <a href="mailto:getreelboostmedia@gmail.com">getreelboostmedia@gmail.com</a> ·
    <a href="https://www.youtube.com/@ReelBoostMedia">@ReelBoostMedia on YouTube</a>
  </footer>
</body>
</html>
